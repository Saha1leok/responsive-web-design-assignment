<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2: Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-box {
            background-color: #83e4b8;
            border: 1px solid #4caf50;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Bootstrap Responsive Columns</h1>
        <div class="row">
            <div class="col-lg-4 col-md-6 col-12">
                <div class="custom-box">Column 1</div>
            </div>
            <div class="col-lg-4 col-md-6 col-12">
                <div class="custom-box">Column 2</div>
            </div>
            <div class="col-lg-4 col-md-12 col-12">
                <div class="custom-box">Column 3</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
