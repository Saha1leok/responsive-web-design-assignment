<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1: Responsive Layout</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap; /* Allows items to wrap to the next line */
            gap: 15px; /* Adds space between boxes */
        }
        .box {
            background-color: #7fadf3;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            flex-grow: 1; /* Allows boxes to grow and fill space */
        }

        /* --- Default Styles (Mobile: stacked vertically) --- */
        .box {
            width: 100%;
        }

        /* --- Tablet Styles (Two boxes in a row) --- */
        @media (min-width: 768px) {
            .box {
                /* Each box takes up roughly 50% of the width, minus the gap */
                width: calc(50% - 8px);
            }
        }

        /* --- Desktop Styles (Three boxes side-by-side) --- */
        @media (min-width: 992px) {
            .box {
                /* Each box takes up roughly 33.33% of the width, minus the gap */
                width: calc(33.333% - 10px);
            }
        }
    </style>
</head>
<body>
    <h1>Responsive Layout with Media Queries</h1>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
</body>
</html>
